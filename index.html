<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>BeeRoll — Generate prototype</title>
<style>

body{margin:0}
a{color:#F5A11D}a:hover{color:#D67E07}
.win{position:relative;width:1440px;height:900px;background:#131416;color:#ECEAE4;font-family:"SF Mono",ui-monospace,Menlo,monospace;font-size:13px;display:flex;flex-direction:column;overflow:hidden;box-sizing:border-box;border-radius:12px;border:1px solid #34373B}
.muted{color:#9A978F}
.h{font-size:13px;font-weight:700;margin:0}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.btn{font:inherit;color:#ECEAE4;background:#212327;border:1px solid #34373B;border-radius:7px;padding:8px 10px;cursor:pointer;text-align:left}
.btn:hover{border-color:#50545A;background:#2A2C30}
.pri{font:inherit;font-size:14px;color:#17160F;background:#F5A11D;border:0;border-radius:8px;padding:10px 18px;cursor:pointer}
.pri:hover{background:#D67E07}
.lnk{font:inherit;color:#9A978F;background:transparent;border:0;padding:0;cursor:pointer}
.lnk:hover{color:#ECEAE4}
.free{font-size:11px;color:#7AA578;border:1px solid #4a6a48;border-radius:4px;padding:1px 5px}
.paid{font-size:11px;color:#FFD475;border:1px solid #6a5a30;border-radius:4px;padding:1px 5px}
.ai{font-size:11px;background:#3d3420;color:#FFD475;border-radius:4px;padding:1px 5px}
.imp{font-size:11px;background:#23303d;color:#9CC3E6;border-radius:4px;padding:1px 5px}
textarea{font:inherit;color:#ECEAE4;background:transparent;border:0;padding:0;resize:none;box-sizing:border-box;line-height:1.5;outline:none;width:100%}
textarea::placeholder{color:#76736C}
input.name{font:inherit;font-size:14px;color:#ECEAE4;background:transparent;border:1px solid transparent;border-radius:6px;padding:4px 8px;width:auto;max-width:320px;outline:none}
input.name:hover{border-color:#34373B}
input.name:focus{border-color:#F5A11D;background:#1A1B1E}
@keyframes kb{from{transform:scale(1)}to{transform:scale(1.18)}}
button:focus{outline:none}
button:focus-visible{outline:2px solid #F5A11D;outline-offset:1px}

html,body{height:100%}
body{background:#0B0C0E;overflow:hidden}
#stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
#app{width:1440px;height:900px;flex:none;transform-origin:center center}
</style>
</head>
<body>
<div id="stage"><div id="app"></div></div>
<template id="tpl">
<div class="win">

  <div style="height: 54px; flex: none; display: flex; align-items: center; gap: 12px; padding: 0 16px; border-bottom: 1px solid #212327">
    <span style="width: 12px; height: 12px; border-radius: 50%; background: #FF5F57"></span>
    <span style="width: 12px; height: 12px; border-radius: 50%; background: #FEBC2E"></span>
    <span style="width: 12px; height: 12px; border-radius: 50%; background: #28C840"></span>
    <div style="margin-left: 8px; position: relative; display: flex; align-items: center; gap: 2px">
      <label style="display: flex"><span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Project name</span><input class="name" size="{{nameSize}}" value="{{name}}" onChange="{{onName}}" placeholder="Untitled" title="Project name — click to rename"></label>
      <button class="lnk" style="width: 26px; height: 26px; border-radius: 6px; font-size: 11px" onClick="{{toggleProjMenu}}" aria-label="Switch project" aria-haspopup="true" aria-expanded="{{projMenuOpen}}">▾</button>
      <sc-if value="{{projMenu}}" hint-placeholder-val="{{false}}">
        <div style="position: absolute; z-index: 8; width: 280px; box-sizing: border-box; background: #212327; border: 1px solid #50545A; border-radius: 12px; padding: 6px; display: flex; flex-direction: column; gap: 2px; box-shadow: 0 16px 40px rgba(0,0,0,.55); left: 0; top: 36px">
          <span class="muted" style="font-size: 11px; padding: 6px 10px 4px">Projects</span>
          <button style="{{projCurStyle}}" onClick="{{toggleProjMenu}}"><span>{{projName}}</span><span style="color: #F5A11D">✓</span></button>
          <sc-for list="{{otherProjects}}" as="o" hint-placeholder-count="2">
            <button style="{{o.style}}" onClick="{{o.open}}"><span>{{o.name}}</span><span class="muted" style="font-size: 11px">{{o.sub}}</span></button>
          </sc-for>
          <div style="height: 1px; background: #34373B; margin: 4px 0"></div>
          <button style="{{projItemStyle}}" onClick="{{newProject}}"><span>+ New project</span></button>
        </div>
      </sc-if>
    </div>
    <div style="flex: 1; display: flex; justify-content: center">
      <div style="display: flex; background: #1A1B1E; border: 1px solid #34373B; border-radius: 8px; padding: 2px">
        <button style="{{tabGenStyle}}" onClick="{{toGen}}">Generate</button>
        <button style="{{tabEditStyle}}" onClick="{{toEdit}}">Edit</button>
      </div>
    </div>
    <span class="muted" style="width: 170px; text-align: right">AI credits {{creditsText}}</span>
    <sc-if value="{{isEditTab}}" hint-placeholder-val="{{false}}">
      <button class="btn" style="{{pvBtnStyle}}" onClick="{{openPvEdit}}" title="Full-window preview · Space plays, Esc closes">▶ Preview</button>
      <button class="btn" style="{{expBtnStyle}}" onClick="{{exportEdit}}"><span style="color: #F5A11D">●</span> Export</button>
    </sc-if>
    <button class="lnk" style="margin-left: 4px" onClick="{{restart}}">Start over</button>
  </div>

  <sc-if value="{{isGenAny}}" hint-placeholder-val="{{true}}">
    <div style="flex: 1; display: flex; min-height: 0">
      <sc-if value="{{hasVids}}" hint-placeholder-val="{{false}}">
      <div style="width: 260px; flex: none; border-right: 1px solid #212327; display: flex; flex-direction: column; min-height: 0; box-sizing: border-box">
        <div style="padding: 14px 14px 10px; display: flex; flex-direction: column; gap: 10px">
          <div class="row"><span class="h" style="font-size: 15px">Videos <span class="muted" style="font-weight: 400">· {{videoCount}}</span></span><button class="lnk" style="font-size: 12px; color: #F5A11D" onClick="{{focusNew}}">+ New video</button></div>
          <label style="display: flex"><span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Search videos</span><input style="font: inherit; font-size: 12px; color: #ECEAE4; background: #1A1B1E; border: 1px solid #34373B; border-radius: 8px; padding: 7px 10px; width: 100%; box-sizing: border-box; outline: none" value="{{q}}" onChange="{{onQ}}" placeholder="Search by what they show"></label>
        </div>
        <div style="flex: 1; min-height: 0; overflow-y: auto; padding: 0 8px 12px; display: flex; flex-direction: column; gap: 2px">
          <sc-if value="{{isNewMode}}" hint-placeholder-val="{{false}}">
            <div style="border-radius: 8px; padding: 6px; display: flex; gap: 10px; align-items: center; background: #212327; box-shadow: inset 2px 0 0 #F5A11D">
              <span style="flex: none; width: 64px; height: 36px; border-radius: 5px; border: 1px dashed #50545A; box-sizing: border-box; display: flex; align-items: center; justify-content: center; color: #8A8D93">+</span>
              <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px"><span>New video</span><span class="muted" style="font-size: 11px">Describe it on the right</span></span>
            </div>
          </sc-if>
          <sc-for list="{{videoList}}" as="w" hint-placeholder-count="3">
            <button style="{{w.style}}" onClick="{{w.pick}}">
              <span style="{{w.thumb}}"><span style="{{w.bar}}"></span></span>
              <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px">
                <span style="white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{w.label}}</span>
                <span class="muted" style="font-size: 11px">{{w.sub}}</span>
                <sc-if value="{{w.hasUsed}}" hint-placeholder-val="{{false}}"><span style="font-size: 11px; color: #7AA578; line-height: 1.35">{{w.used}}</span></sc-if>
              </span>
            </button>
          </sc-for>
          <sc-if value="{{noMatches}}" hint-placeholder-val="{{false}}"><span class="muted" style="font-size: 12px; padding: 8px 6px">No video shows “{{q}}”.</span></sc-if>
        </div>
      </div>
      </sc-if>
      <sc-if value="{{showStart}}" hint-placeholder-val="{{true}}">
      <div style="flex: 1; display: flex; align-items: center; justify-content: center; padding-bottom: 40px">
        <div style="width: 780px; display: flex; flex-direction: column; gap: 14px">
          <h1 style="margin: 0 0 6px; font-size: 26px; font-weight: 700; text-align: center">What should the video show?</h1>
          <div style="{{composerStyle}}" onDragOver="{{onDragOver}}" onDragLeave="{{onDragLeave}}" onDrop="{{onDrop}}">
            <sc-if value="{{hasImg}}" hint-placeholder-val="{{false}}">
              <div style="display: flex; gap: 10px; align-items: center; align-self: flex-start; background: #212327; border: 1px solid #34373B; border-radius: 10px; padding: 6px 8px 6px 6px">
                <span style="width: 44px; height: 44px; border-radius: 6px; background: linear-gradient(135deg,#2c4a3a,#6f9a5c 60%,#d9c27a)"></span>
                <span style="display: flex; flex-direction: column; gap: 2px"><span>{{imgName}}</span><span style="{{imgUseStyle}}">{{imgUse}}</span></span>
                <button class="lnk" style="width: 28px; height: 28px; font-size: 14px" onClick="{{removeImg}}" aria-label="Remove image">✕</button>
              </div>
            </sc-if>
            <textarea style="height: 96px; font-size: 16px" value="{{prompt}}" onChange="{{onPrompt}}" onKeyDown="{{onPromptKey}}" placeholder="Describe the video. Drop a photo here to start from it." aria-label="Describe the video"></textarea>
            <div style="position: relative; display: flex; align-items: center; gap: 8px; height: 36px">
              <button style="width: 36px; height: 36px; flex: none; border-radius: 18px; border: 1px solid #34373B; background: #212327; color: #ECEAE4; cursor: pointer; display: flex; align-items: center; justify-content: center; padding: 0" onClick="{{addImg}}" aria-label="Attach a photo" title="Attach a photo — or drag one onto this box">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"></rect><circle cx="9" cy="10" r="1.6"></circle><path d="M21 16l-5-5-8 8"></path></svg>
              </button>
              <button style="{{modelBtnStyle}}" onClick="{{toggleModelMenu}}" aria-expanded="{{modelMenuOpen}}" aria-haspopup="true"><span>{{modelName}}</span><span class="muted">{{modelSub}}</span><span class="muted" style="font-size: 10px">▾</span></button>
              <div style="display: flex; height: 36px; box-sizing: border-box; align-items: center; background: #131416; border: 1px solid #34373B; border-radius: 18px; padding: 3px">
                <sc-for list="{{lenOpts}}" as="m" hint-placeholder-count="3"><button style="{{m.style}}" onClick="{{m.pick}}">{{m.label}}</button></sc-for>
              </div>
              <div style="flex: 1"></div>
              <button class="pri" style="{{genBtnStyle}}" onClick="{{generate}}">◆ Generate · {{genCostShort}}</button>
              <sc-if value="{{modelMenu}}" hint-placeholder-val="{{false}}">
                <div style="position: absolute; left: 44px; bottom: 44px; z-index: 6; width: 340px; background: #212327; border: 1px solid #50545A; border-radius: 12px; padding: 6px; display: flex; flex-direction: column; gap: 2px; box-shadow: 0 16px 40px rgba(0,0,0,.55)">
                  <sc-for list="{{modelOpts}}" as="m" hint-placeholder-count="3">
                    <button style="{{m.style}}" onClick="{{m.pick}}">
                      <span class="row"><span style="font-weight: 700">{{m.name}} <span class="muted" style="font-weight: 400">· {{m.sub}}</span></span><span style="color: #F5A11D">{{m.check}}</span></span>
                      <span class="muted" style="font-size: 11px">{{m.detail}}</span>
                      <span style="{{m.photoStyle}}">{{m.photo}}</span>
                    </button>
                  </sc-for>
                </div>
              </sc-if>
            </div>
          </div>
          <sc-if value="{{imgConflict}}" hint-placeholder-val="{{false}}">
            <div style="display: flex; gap: 12px; align-items: center; background: #3d3420; color: #FFD475; border-radius: 10px; padding: 10px 14px">
              <span style="flex: 1; line-height: 1.45">{{modelName}} makes video from text only — it would ignore your photo.</span>
              <button class="btn" style="padding: 5px 10px" onClick="{{switchImgModel}}">Use Sora 2</button>
              <button class="lnk" style="color: #FFD475" onClick="{{removeImg}}">Remove photo</button>
            </div>
          </sc-if>
          <div class="muted" style="display: flex; justify-content: space-between; font-size: 12px; padding: 0 4px">
            <span>Enter generates · Shift-Enter starts a new line</span>
            <span>{{lenNote}}</span>
          </div>
          <sc-if value="{{hasStartSugs}}" hint-placeholder-val="{{false}}">
            <div style="display: flex; flex-direction: column; gap: 8px; margin-top: 6px">
              <span class="muted" style="font-size: 12px; padding: 0 4px"><span style="color: #F5A11D">✦</span> Before you spend — suggestions made on your Mac</span>
              <div style="display: flex; gap: 10px">
                <sc-for list="{{startSugs}}" as="g" hint-placeholder-count="2">
                <div style="flex: 1; min-width: 0; background: #1A1B1E; border: 1px solid #34373B; border-radius: 12px; padding: 10px 12px; display: flex; flex-direction: column; gap: 6px">
                  <span style="line-height: 1.4">{{g.title}}</span>
                  <span class="muted" style="font-size: 11px; line-height: 1.4">{{g.why}}</span>
                  <div style="display: flex; gap: 10px; align-items: center; margin-top: auto; padding-top: 2px">
                    <button style="{{g.accStyle}}" onClick="{{g.accept}}">{{g.accLabel}}</button>
                    <button class="lnk" style="font-size: 12px; white-space: nowrap" onClick="{{g.dismiss}}">Not now</button>
                    <div style="flex: 1"></div>
                    <span class="{{g.kind}}">{{g.kindLabel}}</span>
                  </div>
                </div>
                </sc-for>
              </div>
            </div>
          </sc-if>
          <sc-if value="{{isNewMode}}" hint-placeholder-val="{{false}}"><span style="text-align: center; margin-top: 18px"><button class="lnk" style="font-size: 12px" onClick="{{toChange}}">Cancel — back to {{vidTitle}}</button></span></sc-if><sc-if value="{{noVids}}" hint-placeholder-val="{{true}}"><span class="muted" style="font-size: 12px; text-align: center; margin-top: 18px">Have a video already? Switch to Edit.</span></sc-if>
        </div>
      </div>
      </sc-if>
      <sc-if value="{{showWork}}" hint-placeholder-val="{{false}}">
      <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; padding: 18px 24px 16px; gap: 12px; background: #0F1012">
        <sc-if value="{{isNewMode}}" hint-placeholder-val="{{false}}">
          <div style="height: 370px; display: flex; align-items: center; justify-content: center">
            <div style="width: 640px; height: 360px; box-sizing: border-box; border: 1.5px dashed #34373B; border-radius: 12px; background: #131416; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px">
              <span style="font-size: 15px; font-weight: 700">Your new video will appear here</span>
              <span class="muted" style="font-size: 12px">Describe it on the right →</span>
            </div>
          </div>
          <div style="display: flex; flex-direction: column; gap: 10px">
            <span class="h muted">Versions</span>
            <div style="width: 150px; height: 120px; box-sizing: border-box; border: 1px dashed #34373B; border-radius: 10px"></div>
          </div>
        </sc-if>
        <sc-if value="{{notNewMode}}" hint-placeholder-val="{{true}}">
        <sc-if value="{{compareOn}}" hint-placeholder-val="{{false}}">
          <div style="align-self: center; display: flex; gap: 16px; align-items: flex-start; height: 370px">
            <div style="display: flex; flex-direction: column; gap: 6px"><div style="{{cmpA}}"></div><span class="muted" style="font-size: 12px">{{cmpAName}}</span></div>
            <div style="display: flex; flex-direction: column; gap: 6px"><div style="{{cmpB}}"></div><span style="font-size: 12px; color: #F5A11D">{{cmpBName}}</span></div>
          </div>
        </sc-if>
        <sc-if value="{{compareOff}}" hint-placeholder-val="{{true}}">
          <div style="height: 370px; display: flex; align-items: center; justify-content: center">
            <div style="{{playerStyle}}">
              <div style="{{playerInner}}"></div>
              <sc-if value="{{playerFromImg}}" hint-placeholder-val="{{false}}">
                <div style="position: absolute; left: 30%; bottom: 0; width: 14%; height: 62%; border-radius: 40% 40% 0 0; background: #f0e4ce; opacity: .5"></div>
                <div style="position: absolute; left: 56%; bottom: 0; width: 14%; height: 58%; border-radius: 40% 40% 0 0; background: #f0e4ce; opacity: .5"></div>
              </sc-if>
              <span style="position: absolute; left: 12px; top: 12px; background: rgba(11,12,14,.75); border-radius: 5px; padding: 3px 8px">{{playerLabel}}</span>
              <div style="position: absolute; right: 12px; top: 12px; display: flex; gap: 6px"><sc-for list="{{playerTags}}" as="t" hint-placeholder-count="0"><span style="background: rgba(11,12,14,.75); border-radius: 5px; padding: 3px 8px; font-size: 11px">{{t}}</span></sc-for></div>
              <sc-if value="{{playerReady}}" hint-placeholder-val="{{true}}">
                <div style="position: absolute; left: 10px; right: 10px; bottom: 10px; display: flex; align-items: center; gap: 8px; background: rgba(11,12,14,.75); border-radius: 10px; padding: 6px 10px 6px 6px">
                  <button style="width: 30px; height: 30px; flex: none; border: 0; border-radius: 8px; background: #ECEAE4; color: #17160F; font: inherit; font-size: 12px; cursor: pointer; padding: 0" onClick="{{gpToggle}}" aria-label="{{gpLabel}}" title="{{gpLabel}}">{{gpIcon}}</button>
                  <button style="width: 30px; height: 30px; flex: none; border: 1px solid #50545A; border-radius: 8px; background: #212327; color: #ECEAE4; font: inherit; font-size: 11px; cursor: pointer; padding: 0" onClick="{{gpStop}}" aria-label="Stop" title="Stop — back to the start">■</button>
                  <div style="flex: 1; height: 4px; background: #50545A; border-radius: 2px"><div style="{{gpBar}}"></div></div>
                  <span style="font-size: 11px; font-variant-numeric: tabular-nums">{{gpTime}}</span>
                </div>
              </sc-if>
              <sc-if value="{{playerBusy}}" hint-placeholder-val="{{false}}">
                <div style="position: absolute; inset: 0; background: rgba(11,12,14,.6); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px">
                  <span style="color: #FFD475">Rendering {{playerPct}}%</span>
                  <div style="width: 240px; height: 4px; background: #50545A; border-radius: 2px"><div style="{{playerBar}}"></div></div>
                  <button class="btn" style="padding: 4px 12px" onClick="{{cancelCur}}">Cancel</button>
                </div>
              </sc-if>
              <sc-if value="{{playerStopped}}" hint-placeholder-val="{{false}}">
                <div style="position: absolute; inset: 0; background: rgba(11,12,14,.78); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; text-align: center; padding: 0 60px">
                  <span style="{{stopTitleStyle}}">{{stopTitle}}</span>
                  <span class="muted" style="line-height: 1.45">{{stopBody}}</span>
                  <span style="background: #1A1B1E; border: 1px solid #34373B; border-radius: 8px; padding: 8px 10px; line-height: 1.45; max-width: 460px">“{{curText}}”</span>
                  <div style="display: flex; gap: 8px"><button class="pri" style="font-size: 13px; padding: 7px 16px" onClick="{{retryCur}}">Retry · {{retryCost}}</button><button class="btn" onClick="{{focusEdit}}">Change the prompt</button></div>
                </div>
              </sc-if>
            </div>
          </div>
        </sc-if>

        <div style="display: flex; flex-direction: column; gap: 10px">
          <div class="row"><span class="h">Versions of {{vidTitle}}</span><span style="display: flex; gap: 14px; align-items: center"><span class="muted">Click to go back — free. ✕ removes a version.</span><sc-if value="{{hasParent}}" hint-placeholder-val="{{false}}"><button class="btn" style="padding: 4px 10px" onClick="{{toggleCompare}}">{{compareLabel}}</button></sc-if></span></div>
          <div style="display: flex; align-items: flex-start; gap: 8px; overflow: hidden">
            <sc-for list="{{vers}}" as="v" hint-placeholder-count="2">
              <div style="{{v.card}}">
                <button style="font: inherit; color: inherit; text-align: left; background: transparent; border: 0; padding: 0; cursor: pointer; display: flex; flex-direction: column; gap: 5px" onClick="{{v.pick}}">
                  <div style="{{v.thumb}}"><div style="{{v.bar}}"></div></div>
                  <span class="row"><span style="{{v.nameStyle}}">{{v.name}}</span><span class="{{v.kind}}">{{v.cost}}</span></span>
                  <span class="muted" style="font-size: 11px; line-height: 1.35">{{v.what}}</span>
                  <sc-if value="{{v.hasFrom}}" hint-placeholder-val="{{false}}"><span style="color: #F5A11D; font-size: 11px">↳ {{v.fromLabel}}</span></sc-if>
                  <sc-if value="{{v.hasStatus}}" hint-placeholder-val="{{false}}"><span style="color: #F28B82; font-size: 11px">{{v.statusText}}</span></sc-if>
                </button>
                <button class="lnk" style="position: absolute; right: 10px; top: 10px; width: 22px; height: 22px; border-radius: 11px; background: rgba(11,12,14,.75); color: #ECEAE4; font-size: 11px" onClick="{{v.remove}}" aria-label="{{v.removeLabel}}" title="{{v.removeLabel}}">✕</button>
                <button class="lnk" style="position: absolute; right: 36px; top: 10px; width: 22px; height: 22px; border-radius: 11px; background: rgba(11,12,14,.75); color: #ECEAE4; font-size: 12px; line-height: 1" onClick="{{v.toggleMenu}}" aria-label="More for {{v.name}}" aria-haspopup="true" aria-expanded="{{v.menuOpen}}">⋯</button>
                <sc-if value="{{v.hasMenu}}" hint-placeholder-val="{{false}}">
                  <div style="position: absolute; right: 8px; top: 36px; z-index: 6; width: 210px; background: #212327; border: 1px solid #50545A; border-radius: 10px; padding: 4px; display: flex; flex-direction: column; box-shadow: 0 12px 30px rgba(0,0,0,.5)">
                    <button style="{{v.moveStyle}}" onClick="{{v.move}}"><span>Move to a new video</span><span class="muted" style="font-size: 11px">{{v.moveNote}}</span></button>
                  </div>
                </sc-if>
              </div>
            </sc-for>
          </div>
        </div>
        </sc-if>
      </div>

      <div style="width: 360px; flex: none; border-left: 1px solid #212327; display: flex; flex-direction: column; box-sizing: border-box">
        <div style="flex: 1; min-height: 0; overflow: hidden; padding: 14px; display: flex; flex-direction: column; gap: 10px">
          <div style="display: flex; flex-direction: column; gap: 2px"><span class="row"><span class="h" style="font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{panelTitle}}</span></span><sc-if value="{{isNewMode}}" hint-placeholder-val="{{false}}"><span class="muted" style="font-size: 12px">{{panelNote}}</span></sc-if></div>
          <div style="{{editBoxStyle}}" onDragOver="{{onDragOver}}" onDragLeave="{{onDragLeave}}" onDrop="{{onDropEdit}}">
            <sc-if value="{{editHasImg}}" hint-placeholder-val="{{false}}">

      pvKnob: pv ? 'position:absolute;top:-5px;width:14px;height:14px;margin-left:-7px;border-radius:50%;background:#ECEAE4;left:' + (pv.t / pv.len * 100) + '%' : '',
      pvTC: pv ? this.mmss(pv.t) + ' / ' + this.mmss(pv.len) : '',
      pvCanExport: !!pv && pv.exp == null,
      pvExpText: !pv || pv.exp == null ? pvDims : pv.exp === 'done' ? '✓ Exported · ' + pvDims : 'Exporting ' + pv.exp + '%',
      pvExpStyle: 'font-size:12px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;' + (pv && pv.exp === 'done' ? 'color:#7AA578' : pv && typeof pv.exp === 'number' ? 'color:#FFD475' : 'color:#9A978F'),
      pvExport: () => this.setState({ pv: { ...this.state.pv, exp: 0 } })
    };
  }
}

</script>

(function () {
  var app = document.getElementById('app');
  function fit() { var k = Math.min(window.innerWidth / 1460, window.innerHeight / 920); app.style.transform = 'scale(' + Math.min(k, 1.5) + ')'; }
  window.addEventListener('resize', fit); fit();
  var demo = /[?&]demo(=1|=true)?(&|$)/.test(location.search);
  mountDC(Component, document.getElementById('tpl'), app, { demo: demo });
})();
</script>
